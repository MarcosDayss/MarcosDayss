<svg width="1200" height="92" viewBox="0 0 1200 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="46" x2="1200" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="70%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1A0D12"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7B72"/>
      <stop offset="100%" stop-color="#FF4D4D"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="14" y="10" width="1172" height="64" rx="10" fill="url(#bgGradient)" stroke="#30363D" stroke-width="1.2"/>

  <rect x="10" y="10" width="6" height="64" rx="3" fill="url(#accentGradient)" filter="url(#softGlow)"/>

  <text x="600" y="44"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#F0F6FC"
        font-size="22"
        font-weight="700"
        font-family="Segoe UI, Arial, sans-serif">
    Technologies
  </text>
</svg>